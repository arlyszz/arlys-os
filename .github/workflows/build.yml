name: Build ARLYS OS ISO

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools zip

      - name: Run Build Script
        run: |
          chmod +x build.sh
          sudo bash build.sh

      - name: Ambil File ISO
        run: |
          sudo cp /root/arlys-build/dist/ARLYS-OS.iso ./ARLYS-OS.iso
          sudo chown runner:runner ./ARLYS-OS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ARLYS-OS-ISO
          path: ARLYS-OS.iso
