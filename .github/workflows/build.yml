name: Build ARLYS OS ISO

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO inside Docker (Full Root Access)
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/build debian:bookworm /bin/bash -c "
            apt-get update && \
            apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools zip curl && \
            cd /build && \
            chmod +x arlys-bootstrap.sh && \
            ./arlys-bootstrap.sh && \
            cp /root/arlys-build/dist/ARLYS-OS-V3.iso /build/ARLYS-OS-V3.iso
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARLYS-OS-V3-ISO
          path: ARLYS-OS-V3.iso
